# Forward degradation model for the KLA restoration task.
#
# The problem statement names exactly three mechanisms and does NOT disclose their
# order or their strengths. Everything uncertain lives in this file so it can be
# recalibrated from official paired data without touching code.
#
# Assumption references point at docs/IMPLEMENTATION_AUDIT.md section 7.

# Additive Gaussian noise standard deviation, normalized [0,1] units (A6, A9).
# Initial prior inherited from the official starter notebook. UNCALIBRATED.
gaussian_sigma: [0.005, 0.08]

# Multiplicative speckle: x * (1 + N(0, sigma)) (A5). UNCALIBRATED.
speckle_sigma: [0.01, 0.15]

# Integer downsampling factors. 2 and 4 are consistent with the two evaluation
# resolutions named in the problem statement (256 and 512).
scales: [2, 4]

# Sampling weights for `scales`; scale 2 is weighted higher because it is the
# default inference contract (A1). Set to null for uniform sampling.
scale_weights: [0.7, 0.3]

# Downsampling kernels (A7). The official kernel is undisclosed, so training
# samples across kernels for robustness. `area` == true pixel averaging.
kernels: [area, bicubic, bilinear]
kernel_weights: [0.5, 0.3, 0.2]

# Which of the six operation orders may be sampled. null = all six.
orders: null

# Pin a single order (used only by the degradation-order ablation).
fixed_order: null

# Probability each noise mechanism is applied at all. Downsampling is always
# applied because the task input is by definition low resolution.
gaussian_prob: 1.0
speckle_prob: 1.0

# MUST stay false: the problem statement says NoisyLR values may legitimately
# extend slightly outside [0,1] and that this is intentional.
clip_noisy: false

metadata:
  source: kla_restoration_colab_starter.ipynb
  calibrated: false
  note: >
    Ranges are an uncalibrated prior. Recalibrate from official paired data via
    scripts/calibrate_degradation.py and record the outcome in
    docs/EXPERIMENT_LOG.md before trusting robustness numbers.
