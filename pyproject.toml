[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kla-restore"
version = "1.0.0"
description = "Semiconductor image restoration for the KLA SEMICON India 2026 hackathon"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy>=1.24,<2",
    "pillow>=10",
    "pyyaml>=6",
    "tqdm>=4.65",
]

[project.optional-dependencies]
# Training/evaluation extras. inference.py never imports these.
eval = ["scikit-image>=0.22", "lpips>=0.1.4", "pandas>=2", "matplotlib>=3.8"]
dev = ["pytest>=8"]

[project.scripts]
kla-train = "kla_restore.cli:train_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
